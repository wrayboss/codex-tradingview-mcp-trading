name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run tests
        run: npm test

      - name: Check Codex MCP bridge
        run: npm run codex:check

      - name: Check safe trade gate fails closed by default
        shell: bash
        run: |
          set +e
          output="$(npm run safe-gate -- --json 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 1 ]; then
            echo "Expected safe-gate with no explicit/account state to exit 1, got $status" >&2
            exit 1
          fi
          if ! grep -q '"allowed": false' <<< "$output"; then
            echo "Expected safe-gate JSON to report allowed=false" >&2
            exit 1
          fi

      - name: Check backtest validator usage failure
        shell: bash
        run: |
          set +e
          output="$(node scripts/validate-backtest.js 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 1 ]; then
            echo "Expected validate-backtest with no args to exit 1, got $status" >&2
            exit 1
          fi
          if ! grep -q "Usage: node scripts/validate-backtest.js <tv-export.csv>" <<< "$output"; then
            echo "Expected validate-backtest with no args to print usage text" >&2
            exit 1
          fi
